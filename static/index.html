<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#385ce8">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/icons/favicon-48.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="UniFind">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description"
          content="UniFind - find and return items around campus.">

    <title>UniFind | Campus Found Items</title>

    <link rel="stylesheet" href="/styles.css?v=11">
    <script defer src="/app.js?v=11"></script>
    <script defer src="/pwa.js?v=1"></script>
</head>

<body>

<header class="topbar">
    <div class="shell navrow">

        <button
            class="brand"
            data-page="community"
            aria-label="UniFind home">

            <span class="mark" aria-hidden="true">U</span>

            <span>
                Uni<span class="brand-blue">Find</span>
                <small>FOUND ITEMS COMMUNITY</small>
            </span>

        </button>

        <nav
            id="nav"
            class="nav"
            aria-label="Main navigation">
        </nav>

        <div class="nav-right">

            <button
                class="account"
                id="accountBtn">
                Log in
            </button>

            <button
                class="primary report-nav"
                data-page="report">
                + Report Found Item
            </button>

        </div>

    </div>
</header>

<main
    id="app"
    class="shell"
    aria-live="polite">

    <p>Loading UniFind...</p>

</main>

<footer class="shell site-footer">
    UniFind · Find it. Claim it. Reunite.
    · University project prototype
</footer>

<div
    id="toastArea"
    class="toast-area"
    aria-live="polite">
</div>

<dialog
    id="modal"
    aria-label="UniFind dialog">

    <div id="modalBody"></div>

</dialog>

</body>
</html>
