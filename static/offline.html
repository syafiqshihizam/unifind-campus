<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#385ce8">
<title>UniFind | Offline</title>
<link rel="icon" href="/icons/favicon-48.png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fd;color:#10244e;font-family:Arial,sans-serif;text-align:center;padding:24px}
  .box{max-width:340px}
  img{width:84px;height:84px;border-radius:20px}
  h1{font-size:1.4rem;margin:18px 0 8px}
  p{color:#607198;line-height:1.5;margin:0 0 20px}
  button{border:0;border-radius:12px;background:#4567ed;color:#fff;font-weight:700;font-size:1rem;padding:13px 24px;min-height:44px}
</style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="UniFind">
    <h1>You are offline</h1>
    <p>UniFind needs an internet connection to show found items and your activity. Please reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
